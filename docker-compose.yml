services:
  streetlab:
    build: .
    # Lokal gebaut; mit STREETLAB_IMAGE=ghcr.io/devsdaub/streetlab und
    # `docker compose pull` stattdessen das Image aus der GitHub-Action
    image: ${STREETLAB_IMAGE:-streetlab}:${STREETLAB_TAG:-latest}
    container_name: streetlab
    ports:
      - "8080:80"
    restart: unless-stopped
